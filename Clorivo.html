<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Clorivo — Prototype Hi-Fi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      background: #12101E;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Hide scrollbars everywhere */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }

    /* Prevent text selection during navigation */
    .clorivo-frame { user-select: none; -webkit-user-select: none; }

    /* CSS Custom Properties — Light (default) */
    .clorivo-frame {
      --c-bg:           #FBFAFC;
      --c-card:         #FFFFFF;
      --c-ink:          #0E0B1F;
      --c-mute:         #6B6880;
      --c-hairline:     #E8E6F0;
      --c-primary:      #6C4DFF;
      --c-primary-deep: #4F36CC;
      --c-primary-soft: #F1ECFF;
      --c-success:      #1F8A5B;
      --c-danger:       #D14343;
      --c-warning:      #C68A00;
    }

    /* CSS Custom Properties — Dark */
    .clorivo-frame.dark {
      --c-bg:           #0F0C1E;
      --c-card:         #1A1630;
      --c-ink:          #EDE9F7;
      --c-mute:         #9088A8;
      --c-hairline:     #252138;
      --c-primary:      #7B5FFF;
      --c-primary-deep: #6040DD;
      --c-primary-soft: #1E1535;
    }

    /* ── Screen transition animations ── */
    @keyframes slideFromRight {
      from { transform: translateX(100%); }
      to   { transform: translateX(0);    }
    }
    @keyframes slideFromLeft {
      from { transform: translateX(-18%); opacity: 0.6; }
      to   { transform: translateX(0);    opacity: 1;   }
    }
    @keyframes fadeUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── Onboarding sheet ── */
    @keyframes sheetIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes sheetFade {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* ── Typing dots (chat) ── */
    @keyframes typingDot {
      0%, 100% { transform: translateY(0);    opacity: 0.4; }
      50%       { transform: translateY(-4px); opacity: 1;   }
    }

    /* ── Floating auth-art badges ── */
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* ── Marquee (promo ticker) ── */
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── Input placeholder color ── */
    input::placeholder { color: #6B6880; opacity: 1; }
    input:focus { outline: none; }
    button { -webkit-tap-highlight-color: transparent; }

    /* ── Page-level layout ──
       Uses the html/body/#root height:100% chain rather than 100vh:
       on mobile browsers, 100vh is the height of the layout viewport
       (ignores the address bar), which pushes bottom-fixed content
       (the tab bar) below the visible area. Percentage heights track
       the real visual viewport instead. */
    #root {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- React 18 + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Design system & components (order matters) -->
  <script type="text/babel" src="tokens.jsx"></script>
  <script type="text/babel" src="ui-kit.jsx"></script>
  <script type="text/babel" src="supabase-client.jsx"></script>

  <!-- V1 screens -->
  <script type="text/babel" src="screen-auth.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-pdp.jsx"></script>
  <script type="text/babel" src="screen-cart.jsx"></script>
  <script type="text/babel" src="screen-checkout.jsx"></script>
  <script type="text/babel" src="screen-tracking.jsx"></script>
  <script type="text/babel" src="screen-account.jsx"></script>

  <!-- V2 screens -->
  <script type="text/babel" src="screen-seller.jsx"></script>
  <script type="text/babel" src="screen-shop.jsx"></script>
  <script type="text/babel" src="screen-cj.jsx"></script>
  <script type="text/babel" src="screen-admin.jsx"></script>
  <script type="text/babel" src="screen-notifications.jsx"></script>
  <script type="text/babel" src="screen-messages.jsx"></script>
  <script type="text/babel" src="screen-category.jsx"></script>

  <!-- Router + render (must be last) -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
